apply plugin: 'com.android.application'

android {
    namespace "com.kumiko.amadeus.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kumiko.amadeus.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode = MAJOR*10000 + MINOR*100 + PATCH，跟 package.json 同步：
        // 2.12.0 → 21200，2.12.1 → 21201，2.13.0 → 21300，2.14.0 → 21400，2.14.1 → 21401，
        // 2.14.2 → 21402，2.14.3 → 21403，2.14.4 → 21404，2.14.5 → 21405，
        // 2.14.6 → 21406，2.14.7 → 21407，2.14.8 → 21408，2.14.9 → 21409，
        // 2.14.10 → 21410，2.14.11 → 21411，2.14.12 → 21412，2.14.13 → 21413，
        // 2.14.14 → 21414，2.14.15 → 21415（v2.14.13/14 因 Android booting bug
        // 已被 git revert 回退至 v2.14.12 代码状态，仅版本号继续往前走以满足
        // GitHub Release 不能复用 tag 的硬约束），2.14.16 → 21416（在 v2.14.15
        // baseline 上重做 v2.14.13/14 的 chatActions LLM scheduleTrigger
        // fall-through 修复，单文件低风险，作为分组重做的第 1 组），
        // 2.14.17 → 21417（聚合 release：v2.14.13/14 剩余的 IME / Embedding /
        // Android exact alarm 三组 + 新设计的 D 方案 LLM 兜底，按组拆 5 个独立
        // commit 便于 booting 时 git revert 二分定位）。
        // 2.14.18 → 21418（v2.14.17 装机 booting 排查：revert c4 ac67aaf
        // Embedding 重构 — 改 ESM 依赖图最有可能在 Capacitor cold-start 触发
        // module-load-time 死锁。其他 4 commit c1/c2/c3/c5 全部保留。装机
        // 仍 booting 则下次再 revert c5 60b121e Android exact alarm 二分），
        // 2.14.19 → 21419（splash 一闪而过 + Embedding issue 1/2 一发解决：
        // c1 index.html IIFE 加 Capacitor 检测一并 remove ka-boot-splash 文字层；
        // c2 styles.xml windowBackground 改 @color/ic_launcher_background
        // (#f9f7f2 跟 Web 同色)，OS launch → WebView → React mount 全程纯色；
        // c3 CloudEmbeddingForm 模型字段三元渲染 + custom 切换时 model=''
        // 修自定义模型 ID 被下拉框覆盖；c4 CloudEmbeddingForm mount selfheal
        // — store 是 default-shaped 但 LS 有真值时拉回，修配置不同步。
        // 全部不动 ESM 依赖图，0 booting 风险，仍按 5 commit 拆分便于二分），
        // 2.14.20 → 21420（Android 输入链路 hotfix：custom embedding model
        // DOM 兜底落盘；聊天发送改用可见 DOM 值避免纯中文按钮灰/文本截断；
        // captureInput=false 验证蓝牙键盘中文；消息列表 bottom clearance；
        // reminder 支持中文数字 + 主模型自然语言理解也能触发 D-fallback 创建任务），
        // 2.14.21 → 21421（Android 后台提醒 hotfix：收窄消息列表底部留白；
        // AlarmManager call 分支改 full-screen notification；IncomingCallActivity
        // 自己播放用户配置铃声 + 长震动；APP 入口主动创建 notification channels
        // 并请求通知权限，避免后台主动消息静默失败）。
        // CI workflow（A1.5）会以 package.json 为权威源覆盖这两个值。
        versionCode 21421
        versionName "2.14.21"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // v2.14.4 H.1: stable release signing.
    //
    // Why this exists:
    //   Until v2.14.3, the CI workflow built `assembleDebug`, which
    //   relies on Gradle's auto-generated debug.keystore. That keystore
    //   is unique per machine / per CI run, so each new APK Android
    //   sees has a *different* signing certificate from the one
    //   previously installed. Android refuses in-place updates across
    //   mismatched certs (INSTALL_FAILED_UPDATE_INCOMPATIBLE), forcing
    //   the user to uninstall the previous version — which wipes the
    //   sandbox (IndexedDB + Capacitor Filesystem + LocalStorage), so
    //   they lose every chat / image / voice / config row that wasn't
    //   manually exported as a ZIP.
    //
    // What this fix is:
    //   The CI workflow decodes a base64-encoded
    //   `kumiko-release.keystore` from a GitHub repository secret into
    //   `android/app/release.keystore` before invoking
    //   `assembleRelease`. Gradle reads the keystore + the matching
    //   passwords from environment variables exported by the same
    //   workflow step (KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD).
    //   The first time the user installs v2.14.4 they must uninstall
    //   v2.14.3 once (last forced uninstall ever); every subsequent
    //   release is signed with the same keystore, so the OS accepts
    //   it as an in-place update and the sandbox survives.
    //
    // Local dev fallback:
    //   When the env vars are absent (every dev machine + the rare CI
    //   path that builds without the secret), we silently skip the
    //   release signingConfig block. Gradle's default behaviour kicks
    //   back in: `assembleDebug` still works, `assembleRelease` will
    //   refuse to sign and produce an unsigned APK we'd never ship.
    //   This keeps the file safe to commit regardless of whether the
    //   developer has the keystore on disk.
    signingConfigs {
        if (System.getenv("KEYSTORE_PASSWORD") != null) {
            release {
                storeFile file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS") ?: "kumiko"
                keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Bind the release keystore only when the env vars actually
            // produced a config above. Without the guard, Gradle would
            // throw "signingConfig signingConfigs.release not found"
            // on every dev machine that lacks the keystore.
            if (System.getenv("KEYSTORE_PASSWORD") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
