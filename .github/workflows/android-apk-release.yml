# Build the universal Android APK for Kumiko-Amadeus on a GitHub-hosted
# ubuntu-latest runner. Mirrors the shape of windows-release.yml /
# linux-appimage.yml (workflow_dispatch only, optional publish input,
# zero Secrets required).
#
# - publish=false (default): produces a debug-signed universal APK as a
#                            workflow artifact only. Use for smoke tests
#                            after every push.
# - publish=true           : additionally attaches the APK to the GitHub
#                            Release matching package.json `version`
#                            using gh CLI + the built-in GITHUB_TOKEN.
#                            That release must already exist (the Windows
#                            workflow normally creates it via
#                            electron-builder --publish always).
#
# Signing strategy (v2.14.4 H.2: stable release keystore):
# - When the four GitHub Secrets are set —
#     ANDROID_KEYSTORE_BASE64   (the binary keystore, base64-encoded)
#     ANDROID_KEYSTORE_PASSWORD (the keystore's storepass)
#     ANDROID_KEY_ALIAS         (the alias inside the keystore)
#     ANDROID_KEY_PASSWORD      (the keypass for that alias; can equal
#                                ANDROID_KEYSTORE_PASSWORD)
#   the workflow decodes the keystore into android/app/release.keystore,
#   exports the matching env vars (which app/build.gradle picks up via
#   System.getenv to hydrate signingConfigs.release), and runs
#   `assembleRelease`. Output: app-release.apk, signed with the stable
#   keystore. Every future build signs with the same cert, so Android
#   accepts in-place updates and the sandbox (IndexedDB + Capacitor
#   Filesystem + LocalStorage) survives across versions.
# - When the secrets are absent (forked repo / pre-keystore-setup runs)
#   the workflow falls back to `assembleDebug`. Each CI run generates a
#   different debug.keystore so devices that installed an earlier debug
#   APK still need an uninstall+reinstall to upgrade — the same
#   pre-v2.14.4 behaviour. The fallback exists so the workflow keeps
#   being green for contributors without secret access.
# - First v2.14.4 install: existing v2.14.3 users (only the maintainer's
#   own test devices, since there are no public users yet) need to
#   uninstall once because v2.14.3 was debug-signed. From v2.14.4
#   onwards, in-place upgrades work and the sandbox is preserved.
# Setup guide for the keystore + secrets lives in
# docs/android-keystore-setup.md.
#
# Universal APK (single APK with every ABI's native libs) is the default
# AGP behavior since we do NOT set `android.splits.abi.enable true`.
# When A5 adds the sqlite-vec ABI-specific .so files under
# `android/app/src/main/jniLibs/{armeabi-v7a,arm64-v8a,x86,x86_64}/`,
# AGP will bundle all four flavors into the same APK so any device can
# install the same artifact.
name: Android APK Release build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the APK to the GitHub Release that matches package.json version"
        type: boolean
        required: true
        default: false

permissions:
  # Needed when publish=true uploads the APK to a Release via gh CLI.
  # Harmless when publish=false.
  contents: write

jobs:
  build:
    name: Build universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 21 (Eclipse Temurin)
        # Capacitor 7 ships its `capacitor-android` library compiled with
        # `sourceCompatibility = VERSION_21` (visible in android/app/capacitor.build.gradle),
        # which means consumers need JDK 21 to call `compileDebugJavaWithJavac`
        # against it. Without this we get
        #   `:capacitor-android:compileDebugJavaWithJavac FAILED — error: invalid source release: 21`
        # Temurin is the conventional choice for CI; setup-java auto-exports
        # JAVA_HOME and adds bin/ to PATH so the gradle wrapper picks it up.
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        # ubuntu-latest already ships with the Android SDK + cmdline-tools
        # but versions can drift between runner images. setup-android pins
        # to a known good cmdline-tools build, accepts SDK licenses, and
        # caches the SDK between runs so cold-start is ~30s instead of ~2min.
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Cache Gradle caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-android-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch shared assets
        # Character-specific copyrighted assets (emotion sprites, ringtones,
        # favicon, KA logo, encrypted lore) live outside the tracked tree
        # and must be unpacked from kumiko-assets.zip before Vite (and the
        # Android launcher icon generator) can pick them up.
        run: npm run fetch-assets

      - name: Build web bundle + sync Capacitor Android
        # `npm run verify:android` runs vite build + build-android-icons +
        # cap copy android + cap update android in one shot, exactly the
        # same chain a developer would run locally before opening Android
        # Studio. Validates that the web payload is Android-compatible
        # before we hand it to gradle.
        run: npm run verify:android

      - name: Read app version from package.json
        # Pull the canonical version string out of package.json so we can
        # (a) overwrite versionName / versionCode in app/build.gradle to
        # match the desktop release without hand-bumping in two places,
        # and (b) reference the same v${VERSION} tag when uploading to
        # the Release in the publish step.
        id: appver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # versionCode = MAJOR*10000 + MINOR*100 + PATCH so 2.12.0 → 21200,
          # mirrors the value committed in app/build.gradle defaultConfig.
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Resolved versionName=$VERSION versionCode=$VERSION_CODE"

      - name: Pin versionName / versionCode from package.json
        # Overwrite the two values in app/build.gradle so a forgotten
        # local bump can't ship an APK that disagrees with the desktop
        # release tag. Idempotent sed (matches the literal lines we
        # commit; falls through silently if someone already changed them).
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.appver.outputs.version_code }}/" android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "${{ steps.appver.outputs.version }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Make gradlew executable
        # The android/gradlew script is committed with executable bit
        # in the linux/macOS sense, but git on Windows can drop the bit
        # depending on core.fileMode settings. Force-set it before invoke.
        run: chmod +x android/gradlew

      - name: Detect release-keystore secret + decode
        # v2.14.4 H.2: when the maintainer-owned keystore secret is
        # present, decode it into android/app/release.keystore so
        # build.gradle's signingConfigs.release picks it up. When it's
        # missing (forked repo build / first-time setup), this step
        # exits cleanly with signed=false and the next step falls back
        # to assembleDebug.
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret not set — falling back to debug signing."
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Decoding release keystore from secret…"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Decoded keystore is empty. Re-check ANDROID_KEYSTORE_BASE64 (must be base64 of the .keystore binary, no line wraps)."
            exit 1
          fi
          # Quick header sanity check (Java keystore magic bytes).
          # Catches "I pasted a path instead of file contents" mistakes
          # before gradle later fails with a less obvious error.
          head -c 4 android/app/release.keystore | xxd | grep -E '(feed feed|cece cece)' >/dev/null || {
            echo "::warning::release.keystore header does not match JKS or PKCS12 magic — gradle may still succeed if it's a valid BKS, but double-check the secret if signing fails below."
          }
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Build universal APK
        # v2.14.4 H.2: pick the assemble task based on whether the
        # release keystore was decoded above. assembleRelease uses the
        # signingConfigs.release block in app/build.gradle which reads
        # KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD env vars below.
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            echo "Running assembleRelease (signed with stable release keystore)."
            ./gradlew assembleRelease --no-daemon --warning-mode=summary
          else
            echo "Running assembleDebug (no release keystore secret available)."
            ./gradlew assembleDebug --no-daemon --warning-mode=summary
          fi

      - name: Verify APK exists + show size
        # Sanity gate: if the assemble task succeeded but the APK is
        # missing for whatever reason (custom output dir, AGP version
        # skew), fail loudly here instead of producing an empty Release
        # asset upload.
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          else
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            ls -la android/app/build/outputs/apk/ || true
            exit 1
          fi
          SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "Built $APK_PATH ($SIZE)"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Rename APK to release-friendly filename
        # Mirrors windows-release.yml's
        # `Kumiko-Amadeus-Setup-${arch}-${version}.exe` naming so the APK
        # sits next to the per-arch Windows installers on the Release page
        # with a consistent version-suffixed scheme.
        # v2.14.4 H.2: drop the "-debug" suffix when release-signed so
        # the user can tell at a glance which APK is the upgrade-safe
        # one. Debug fallback keeps the suffix as a visible "this won't
        # in-place-upgrade your existing install" warning.
        id: rename
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            OUT="release/Kumiko-Amadeus-${{ steps.appver.outputs.version }}-universal.apk"
          else
            OUT="release/Kumiko-Amadeus-${{ steps.appver.outputs.version }}-universal-debug.apk"
          fi
          mkdir -p release
          cp "$APK_PATH" "$OUT"
          echo "apk_path=$OUT" >> $GITHUB_OUTPUT
          ls -la release/

      - name: Upload APK as workflow artifact
        # publish=false stops here. publish=true continues to attach the
        # same APK to the Release; uploading the artifact regardless gives
        # us a 14-day post-mortem download even when the publish path
        # later fails (Release tag missing, network blip, etc).
        uses: actions/upload-artifact@v6
        with:
          name: kumiko-amadeus-android-universal
          path: ${{ steps.rename.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release (publish=true only)
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Use gh CLI (preinstalled on ubuntu-latest) to upload the APK
        # to the existing v${VERSION} release. --clobber overwrites any
        # previous upload of the same filename so a re-run replaces
        # the asset instead of failing on duplicate.
        run: |
          TAG="v${{ steps.appver.outputs.version }}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG does not exist yet. Run windows-release.yml with publish=true first to create the release."
            exit 1
          fi
          gh release upload "$TAG" "${{ steps.rename.outputs.apk_path }}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached ${{ steps.rename.outputs.apk_path }} to release $TAG"
