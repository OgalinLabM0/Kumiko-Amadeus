# Build Linux AppImage for Kumiko-Amadeus on GitHub-hosted runners.
# Trigger: GitHub -> Actions -> "Linux AppImage build" -> Run workflow
# - publish=false (default): produces AppImage + latest-linux*.yml as workflow artifact only
# - publish=true           : additionally attaches artifacts to the GitHub Release
#                            that matches package.json version (requires GH_TOKEN secret).
name: Linux AppImage build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish AppImage + latest-linux*.yml to GitHub Release (requires GH_TOKEN secret)"
        type: boolean
        required: true
        default: false

permissions:
  # Required when electron-builder --publish always uploads to the GitHub Release
  # using the built-in GITHUB_TOKEN fallback. Harmless when publish=false.
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      # v2.14.10 hotfix: when publishing, force serial execution.
      # Both x64 and arm64 jobs run `electron-builder --publish always`,
      # which checks the GitHub Release with `GET /releases/tags/<tag>`
      # and POST-creates it if not found. On Linux both archs finish in
      # ~3m45s on their respective Azure runners, so the GETs race and
      # the second arrival hits HTTP 422 `tag_name already_exists` (we
      # lost the v2.14.10 arm64 AppImage to this exact race; v2.14.9's
      # arm64 was lost to a separate transient 502 in fetch-assets,
      # see scripts/fetch-assets.cjs retry path). max-parallel = 1 makes
      # x64 (listed first below) finish publishing before arm64 starts,
      # so arm64's electron-builder finds the existing release via GET
      # and just uploads to it. publish=false stays parallel for fast
      # PR feedback. Windows uses the same pattern preemptively even
      # though x64 currently always wins by a wide margin (NSIS is slow).
      max-parallel: ${{ inputs.publish && 1 || 2 }}
      matrix:
        include:
          # appimage_arch is how electron-builder names the AppImage file on
          # Linux (it follows `uname -m`, so x64 becomes x86_64). `arch` stays
          # in electron-builder CLI parlance (--x64 / --arm64) and is also
          # used for cache keys and artifact names that face developers.
          # ORDERING MATTERS WHEN max-parallel=1: x64 must be first because
          # it owns kumiko-assets.zip upload and creates the GitHub Release.
          - arch: x64
            runner: ubuntu-24.04
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux build toolchain
        # build-essential + python3 are needed to compile hnswlib-node via node-gyp.
        # libfuse2 is only required to *run* an AppImage, not to build it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3

      - name: Cache bge-m3 ONNX model
        uses: actions/cache@v5
        with:
          path: models/bge-m3-onnx/model_int8.onnx
          key: bge-m3-model-int8-v1

      - name: Fetch bge-m3 ONNX model
        run: node scripts/fetch-bge-model.cjs

      - name: Cache electron & electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-linux-${{ matrix.arch }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch shared assets
        # Character-specific assets (emotion sprites, ringtones, favicon,
        # logo, encrypted lore/worldbook) live outside the tracked tree and
        # must be unpacked from kumiko-assets.zip before Vite / electron-builder
        # can pick them up. The script is idempotent for local devs who
        # already have the assets on disk.
        run: npm run fetch-assets

      - name: Build web bundle
        run: npm run build:cap

      - name: Clean release directory (prebuild)
        run: node scripts/clean-release.cjs prebuild

      - name: Build AppImage (no publish)
        if: inputs.publish != true
        run: npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never

      - name: Smoke-test AppImage contents
        if: inputs.publish != true
        # Quickly extract the AppImage (no FUSE needed) and verify that
        # AppRun / app.asar / native modules / bge-m3 ONNX model all made it in.
        # publish=true skips this: by the time the build finishes electron-builder
        # has already uploaded to the GitHub Release, so the check would be too
        # late anyway -- the canonical flow is publish=false first, then publish=true.
        run: node scripts/verify-appimage-contents.cjs "release/Kumiko-Amadeus-${{ matrix.appimage_arch }}.AppImage"

      - name: Build AppImage (publish to release)
        if: inputs.publish == true
        env:
          # Prefer a user-provided PAT in GH_TOKEN; fall back to the built-in
          # GITHUB_TOKEN for same-repo releases. electron-builder reads either.
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage --${{ matrix.arch }} --publish always

      - name: Upload kumiko-assets.zip to release
        # Only x64 uploads: the zip content is arch-agnostic and we do not want
        # both matrix jobs racing to attach the same asset to the release.
        if: inputs.publish == true && matrix.arch == 'x64'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npm run release:assets
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" release/kumiko-assets.zip --clobber

      - name: Generate latest-linux*.yml (no-publish mode only)
        if: inputs.publish != true
        # When publish=true electron-builder already writes and uploads these
        # channel files; running our local generator would duplicate the effort
        # and overwrite any sha512 electron-builder chose.
        run: node scripts/generate-latest-yml.cjs

      - name: Regenerate latest-linux*.yml + clobber upload (publish mode)
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        # v2.14.28 M8: mirror the windows-release.yml defense — even on the
        # publish=true path, run the local generator and force-upload the
        # latest-linux*.yml so the auto-updater channel files are
        # canonical regardless of electron-builder's race-prone POST.
        # The publish step above already wrote them, but we re-emit
        # locally to make sure sha512 / file-size match what's actually
        # on disk in release/ — and `--clobber` overwrites the release
        # asset if electron-builder already uploaded a stale copy.
        run: |
          node scripts/generate-latest-yml.cjs
          TAG="v$(node -p "require('./package.json').version")"
          # Each arch matrix produces its own file under release/ —
          # gh release upload tolerates missing files, so this is safe
          # even when an arch hasn't shipped a particular channel file.
          if [ -f release/latest-linux.yml ]; then
            gh release upload "$TAG" release/latest-linux.yml --clobber
          fi
          if [ -f release/latest-linux-arm64.yml ]; then
            gh release upload "$TAG" release/latest-linux-arm64.yml --clobber
          fi

      - name: Clean release directory (postbuild)
        run: node scripts/clean-release.cjs postbuild

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v6
        with:
          name: kumiko-amadeus-linux-${{ matrix.arch }}
          path: |
            release/Kumiko-Amadeus-${{ matrix.appimage_arch }}.AppImage
            release/Kumiko-Amadeus-${{ matrix.appimage_arch }}.AppImage.blockmap
            release/latest-linux*.yml
          if-no-files-found: error
          retention-days: 14
