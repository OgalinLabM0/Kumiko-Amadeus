
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!--
      Phase 5 Part C: match the manifest's `theme_color` so Android's
      status bar blends into the chat gradient instead of flashing the
      legacy black value every page load. Apple's status-bar-style
      stays "black-translucent" — on iOS the native status bar
      overlays the top safe-area, and safeAreaPaddingTop CSS
      compensates — which keeps the IntroScreen's top ornaments
      visible under the notch.
    -->
    <meta name="theme-color" content="#f9f7f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kumiko" />
    <meta name="application-name" content="Kumiko·Amadeus" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Phase 7 Part t1_icons: the `.ico` was the only favicon file we used
      to ship for Safari + Chrome tabs; on machines where the fetch-assets
      script never ran it was missing, so the browser fell back to a grey
      default. The `.png` sibling is always in git and desktop
      electron-builder still reads `favicon-KA.ico` / `favicon-KA.png` for
      Windows + Linux installers via package.json build config — we only
      flip the *web* reference here.
    -->
    <link rel="icon" type="image/png" href="/favicon-KA.png" />
    <!-- iOS home-screen installs read `apple-touch-icon` (180px). The
         192 / 512 PNGs are generated by scripts/build-pwa-icons.cjs at
         build time; don't reference them here — they live in the
         webmanifest for Android launchers. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <!-- iOS splash screen — single generic fallback; device-specific
         splash screens can be generated by pwa-asset-generator later
         without touching other files. -->
    <link rel="apple-touch-startup-image" href="/icon-512.png" />
    <title>Kumiko·Amadeus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;600;700&display=swap');
      
      :root {
        /* Phase 7 regression fix (iOS PWA viewport collapse):
           - `--app-height` used to be 100% which triggers layout collapse
             under `viewport-fit=cover` + `black-translucent` on iOS PWA
             standalone (silent fallback to non-cover, content never extends
             behind notch). `100vh` is the ONLY value that works from cold
             start; `useAppViewport.ts` overrides this to a JS-measured px
             value at runtime for extra stability.
           - `--sat/--sar/--sab/--sal` default to `env(safe-area-inset-*)`
             so every component that reads `var(--sat)` etc. gets the
             browser's value by default. `useAppViewport.ts` runs a DOM
             probe + viewport-fit toggle trick at boot to override them
             with JS-measured px values, surviving the well-known iOS
             26.1 regression where `env()` returns 0 on cold start. */
        --app-height: 100vh;
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --font-ui: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Plus Jakarta Sans', sans-serif;
        --font-reading: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Plus Jakarta Sans', sans-serif;
        --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'Cormorant Garamond', serif;
        --font-elegant: 'Cormorant Garamond', 'Plus Jakarta Sans', Georgia, serif;
        --font-mono: 'IBM Plex Mono', 'Noto Sans SC', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --type-micro: clamp(10px, 0.6rem + 0.05vw, 11px);
        --type-caption: clamp(11px, 0.66rem + 0.08vw, 12px);
        --type-label: clamp(11px, 0.66rem + 0.08vw, 12px);
        --type-body: clamp(13px, 0.84rem + 0.1vw, 15px);
        --type-title: clamp(15px, 0.92rem + 0.16vw, 18px);
        --tracking-ui: 0.01em;
        --tracking-label: 0.14em;
        --tracking-kicker: 0.18em;
        --leading-copy: 1.72;
      }

      html {
        /* Phase 7 regression fix: `height: 100%` + viewport-fit=cover +
           black-translucent silently collapses the layout on iOS PWA
           (content never extends behind the notch). `100vh` in PWA
           standalone equals `100dvh` and `window.innerHeight`, but is
           the only unit that survives cold start. */
        height: 100vh;
        width: 100%;
        margin: 0;
        padding: 0;
        /* Critical for iOS: prevents pull-to-refresh/rubber-banding on the body */
        overscroll-behavior-y: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Prevent double-tap zoom on buttons */
        touch-action: manipulation;
        background-color: #000; /* Dark background to match app */
      }

      body {
        /* Phase 7 regression fix: see html selector. `useAppViewport.ts`
           overrides this to a JS-measured px (and `position:fixed`) at
           runtime, but the static fallback must be 100vh (not 100%) so
           that layout does not collapse before hydration. */
        height: 100vh;
        width: 100%;
        margin: 0;
        padding: 0;
        font-family: var(--font-ui);
        font-size: var(--type-body);
        line-height: 1.58;
        letter-spacing: var(--tracking-ui);
        background-color: #000; /* Dark background to match app */
        color: #e0e0e0;
        overflow: hidden; /* Prevent body scroll, handle in app */
        -webkit-tap-highlight-color: transparent;
        text-rendering: optimizeLegibility;
      }

      button, input, textarea, select {
        font: inherit;
      }

      .font-mono {
        font-family: var(--font-mono) !important;
        letter-spacing: 0.035em;
      }

      .font-mincho {
        font-family: var(--font-display) !important;
      }

      .font-elegant {
        font-family: var(--font-elegant) !important;
      }

      .ka-panel-title {

      }

      }

      }

      .ka-section-title {

      .ka-section-desc {

      .ka-value {

      .ka-setting-item-title {

        line-height: 1.42;

        letter-spacing: 0.008em;
      }

      .ka-copy {
        font-family: var(--font-reading);
        font-size: var(--type-body);

      }

      .ka-copy-sm {

      }

        letter-spacing: 0.01em;
      }

      .ka-chat-copy {
        font-family: var(--font-reading);
        font-size: var(--type-body);
        line-height: 1.78;

      }

      .ka-input-copy {
        font-family: var(--font-reading);
        font-size: clamp(13px, 0.82rem + 0.08vw, 14px);

      }

      /* Lined-notebook texture for MemoryPanel content areas.
         Renders horizontal guide lines at every 28px via a
         repeating-linear-gradient. Text baseline is nudged to sit ON
         the lines by forcing line-height: 28px in the consuming element
         (already applied here). Padding-top aligns the first row of
         text with the first visible rule. */
      .ka-notebook-lined-light {
        background-color: #fdfcf6;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          rgba(107, 95, 75, 0.22) 27px,
          rgba(107, 95, 75, 0.22) 28px
        );
        background-attachment: local;
        line-height: 28px;
        padding-top: 6px;
      }
      .ka-notebook-lined-dark {
        background-color: #1a1814;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 27px,
          rgba(215, 187, 136, 0.14) 27px,
          rgba(215, 187, 136, 0.14) 28px
        );
        background-attachment: local;
        line-height: 28px;
        padding-top: 6px;
      }

      .ka-settings-shell {
        font-family: var(--font-ui);
      }

      .ka-settings-shell .ka-section-title {
        font-family: var(--font-reading);
        font-size: clamp(13px, 0.8rem + 0.06vw, 15px);
        font-weight: 700;
        line-height: 1.28;
        letter-spacing: 0.012em;
      }

      .ka-settings-shell .ka-section-desc {
        font-family: var(--font-reading);
        font-size: clamp(11px, 0.72rem + 0.04vw, 12px);
        line-height: 1.56;
        letter-spacing: 0.01em;
      }

      .ka-settings-shell .ka-setting-item-title {
        font-family: var(--font-reading);
        font-size: clamp(11px, 0.72rem + 0.04vw, 12px);
        line-height: 1.42;
        font-weight: 650;
        letter-spacing: 0.008em;
      }

      .ka-settings-shell .ka-label {
        font-size: clamp(11px, 0.7rem + 0.04vw, 12px);
        letter-spacing: 0.035em;
      }

      .ka-settings-shell .ka-copy {
        font-size: clamp(13px, 0.81rem + 0.05vw, 14px);
        line-height: 1.64;
      }

      .ka-settings-shell .ka-copy-sm,
      .ka-settings-shell .ka-input-copy {
        font-size: clamp(11px, 0.72rem + 0.04vw, 12px);
        line-height: 1.58;
      }

      .ka-settings-shell .ka-copy-xs {
        font-family: var(--font-reading);
        font-size: clamp(10px, 0.66rem + 0.04vw, 11px);
        line-height: 1.5;
        letter-spacing: 0.01em;
      }

      .ka-settings-shell input,
      .ka-settings-shell textarea,
      .ka-settings-shell select,
      .ka-settings-shell button {
        font-family: var(--font-ui);
      }

      .ka-settings-shell .ka-settings-kicker {
        font-family: var(--font-ui);
        font-size: clamp(10px, 0.66rem + 0.04vw, 11px);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .ka-settings-shell .ka-settings-panel-title {
        font-family: var(--font-display);
        font-size: clamp(16px, 1rem + 0.28vw, 21px);
        font-weight: 700;
        line-height: 1.16;
        letter-spacing: 0.018em;
      }

      .ka-settings-shell .ka-settings-nav-label {
        font-family: var(--font-reading);
        font-size: clamp(11px, 0.72rem + 0.04vw, 13px);
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: 0.008em;
      }

      .ka-settings-shell .ka-settings-nav-desc {
        font-family: var(--font-reading);
        font-size: clamp(10px, 0.68rem + 0.04vw, 11px);
        line-height: 1.45;
        letter-spacing: 0.008em;
      }

      .ka-soft-h-scroll {
        scrollbar-width: thin;
        scrollbar-color: #d2b26a transparent;
      }

      .ka-soft-h-scroll::-webkit-scrollbar {
        height: 5px;
      }

      .ka-soft-h-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .ka-soft-h-scroll::-webkit-scrollbar-thumb {
        background: linear-gradient(90deg, rgba(214, 187, 124, 0.72), rgba(193, 151, 55, 0.88));
        border-radius: 999px;
      }

      .ka-soft-h-scroll::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(90deg, rgba(208, 179, 112, 0.82), rgba(183, 139, 40, 0.96));
      }
      
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: #b8860b;
        border-radius: 4px;
      }

      /* Hide Scrollbar Utility */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* --- iOS Momentum Scrolling Helper --- */
      .touch-scroll {
        -webkit-overflow-scrolling: touch;
      }
      
      /* --- iOS Safe Area Helper ---
         Phase 7 regression fix: replaced raw `env(safe-area-inset-*)` with
         `var(--sat/--sab)` which defaults to env() and is overridden by
         `useAppViewport.ts`'s DOM-probe values. This gives us a single
         source of truth that survives cold start + iOS 26.1 regression. */
      .safe-area-padding {
        padding-top: var(--sat) !important;
        padding-bottom: var(--sab) !important;
      }
      .safe-area-padding-top {
        padding-top: var(--sat) !important;
      }
      .safe-area-padding-bottom {
        padding-bottom: var(--sab) !important;
      }
      .safe-area-padding-modal {
        padding-top: max(1rem, var(--sat)) !important;
        padding-bottom: max(1rem, var(--sab)) !important;
      }
      @media (min-width: 768px) {
        .safe-area-padding-modal {
          padding-top: max(2.5rem, var(--sat)) !important;
          padding-bottom: max(2.5rem, var(--sab)) !important;
        }
      }
      .safe-area-pb {
        padding-bottom: calc(0.5rem + var(--sab)) !important;
      }
      @media (min-width: 768px) {
        .safe-area-pb {
          padding-bottom: calc(1rem + var(--sab)) !important;
        }
      }

      /* Animations - Simplified for Mobile Performance */
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.02); opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes blink {
        0%, 90%, 100% { opacity: 1; }
        95% { opacity: 0; }
      }

      .scanline-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.1) 50%,
          rgba(0, 0, 0, 0.1)
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 50;
        opacity: 0.2;
      }

      /* --- IOS HEAT/PERFORMANCE OPTIMIZATION --- */
      @media screen and (max-width: 768px) {
        .scanline-overlay {
          display: none; /* Disable scanlines entirely on mobile */
        }
      }

      .glitch-text {
        position: relative;
      }
      
      .amadeus-bg-grid {
        background-image: 
          linear-gradient(rgba(184, 134, 11, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(184, 134, 11, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        /* PERFORMANCE FIX: Removed 'will-change: transform' to save VRAM on static background */
      }

      /* --- Resize performance freeze ---
         backdrop-filter (used by every modal: MemoryPanel, SettingsPanel, FullGuideModal)
         is extremely expensive in Chromium: each frame it must capture the pixels beneath
         and run a Gaussian-blur shader. During window resize those underlying pixels change
         every frame, so the blur is fully recomputed per frame -- this is THE main cause
         of modal resize jank.

         While <html> carries the data-resizing flag (set by App.tsx's resize listener and
         released 200ms after the last tick), we forcibly disable backdrop-filter on every
         element that uses it (Tailwind variants backdrop-blur-sm / backdrop-blur-[8px]
         plus any inline style). Transitions and animations are frozen alongside so no
         extra per-frame work piles up during the drag. After 200ms of no resize events
         the flag is removed and everything restores in a single reflow.

         NOTE: the earlier blanket `content-visibility: hidden` rule that hid every modal
         subtree during resize was removed -- combined with `opacity: 0.9999` on the
         BrowserWindow it caused newly-exposed pixels during resize to show the desktop
         underneath (see plan: resize_brown_flash_fix). Instead of the blanket rule we
         now use a narrower `[data-resize-heavy]` selector further down that only skips
         the truly expensive reflow subtrees (chat virtual list + panel inner content),
         so panel headers / close buttons / chat header / input stay visible. */
      html[data-resizing] [class*="backdrop-blur"],
      html[data-resizing] [style*="backdrop-filter"] {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      html[data-resizing] *,
      html[data-resizing] *::before,
      html[data-resizing] *::after {
        transition-duration: 0s !important;
        animation-duration: 0s !important;
        animation-iteration-count: 1 !important;
      }

      /* Skip layout + paint + composite for the HEAVIEST subtrees while resizing.
         These are the ones that dominate reflow cost on APP page: chat virtual list
         plus each modal panel's inner content region. Lightweight siblings (panel
         header, close button, chat header/footer, bg-grid layer) still render normally
         so the window frame tracks the drag smoothly; only the expensive inner list
         briefly hides and recovers in a single paint after the 200ms release. */
      html[data-resizing] [data-resize-heavy] {
        content-visibility: hidden !important;
        contain-intrinsic-size: auto 80vh !important;
      }

      /* --- View Transitions --- */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }
      ::view-transition-old(root) { z-index: 1; }
      ::view-transition-new(root) { z-index: 9999; }

      /* --- iOS ZOOM FIX --- */
      @media screen and (max-width: 768px) {
        input, textarea, select {
          font-size: 16px !important;
        }
      }

      /* --- Phase 4 Part A: mobile-form-factor settings shell -----------------

         SettingsPanel was tuned for tablet+ (compact layout kicks in < 900px),
         but on actual phones the modal still had visible outer padding + 30px
         rounded corners that felt like a "floating card" instead of a native
         sheet. At ≤ 768px we:

         - zero the backdrop's horizontal padding so the shell is full-bleed,
         - strip the shell's rounded corners + border (native screen feel),
         - tighten the content column padding from px-4 to px-3,
         - hide the mouse-drag scrub indicator under the tab bar (the native
           touch scroll is the same gesture so the thumb is redundant noise),
         - enforce a 44px minimum touch target on the nav chips + side-rail
           buttons so they pass WCAG AA on phones without us having to rewrite
           every section markup.

         Per-section layouts (grid/flex) keep their existing Tailwind sm:/md:
         variants; the rest of the pass lives in Phase 4 Part A's section
         edits (e.g. TtsConfigSection's split-method row). */
      @media screen and (max-width: 768px) {
        .ka-settings-backdrop {
          padding-left: 0 !important;
          padding-right: 0 !important;
        }
        /* Phase 7 Bug 1: only force full-bleed when user explicitly toggles to
           expanded view. The compact popup keeps its component-authored size
           (w-[min(92vw,60rem)] h-[min(88dvh,50rem)]) so mobile defaults to a
           small centered panel that leaves the status bar + home indicator
           visible. The outer backdrop's safe-area-padding-modal handles notch
           clearance. */
        .ka-settings-shell[data-settings-expanded="true"] {
          width: 100vw !important;
          /* Phase 7 regression fix: 100dvh suffered iOS PWA cold-start bug
             (returned stale values until viewport geometry changed). We now
             route through `var(--app-height)` which `useAppViewport.ts`
             keeps in sync with the JS-measured innerHeight. */
          height: var(--app-height) !important;
          max-width: 100vw !important;
          max-height: var(--app-height) !important;
          border-radius: 0 !important;
          border-width: 0 !important;
        }
        .ka-settings-shell [data-settings-topnav-indicator] {
          display: none !important;
        }
        .ka-settings-shell [data-settings-topnav] button,
        .ka-settings-shell [data-settings-siderail] button {
          min-height: 44px;
        }
        .ka-settings-shell [data-settings-content] {
          padding-left: 0.75rem !important;
          padding-right: 0.75rem !important;
        }
        /* Phase 7 Bug 2: avatar system HUD (AMADEUS / SYS-ID) sits under the
           chat header on mobile (header height ≈ 4rem + safe-area-inset-top).
           Use a class so tailwind's `md:top-10` desktop rule is untouched.
           Mobile trim: mirror AppChatHeader's `max(var(--sat) - 6px, 0px)`
           shift so the HUD stays pinned right under the header. */
        .ka-mobile-hud-offset {
          top: calc(4rem + max(var(--sat) - 6px, 0px) + 0.5rem) !important;
        }
      }

      /* --- Phase 4 Part A: modal + panel full-bleed on phones ---------------

         Other floating surfaces (ProfilePanel, MemoryPanel, DiaryPanel,
         TaskPanel, MessageCenterPanel, FullGuideModal, DiaryBackfillDialog,
         CustomDialog) share the same `absolute inset-0 ... p-3 md:p-5`
         backdrop pattern. Tag them with `ka-mobile-fullbleed-backdrop` /
         `ka-mobile-fullbleed-sheet` so a single rule here removes the
         outer air-gap and sheet corners on ≤ 768px without touching every
         panel's JSX. */
      @media screen and (max-width: 768px) {
        .ka-mobile-fullbleed-backdrop {
          padding: 0 !important;
        }
        /* Phone-only footer extender: some panels (e.g. MemoryPanel's bottom
           status bar) look like a pale stripe above the home indicator,
           because the sheet's `padding-bottom: var(--sab)` area exposes the
           sheet's own background (near-white / near-black), which differs
           from the footer color. The ::after pseudo-element sits exactly in
           that padding-bottom area (absolute, top:100%, height:var(--sab))
           and inherits the footer's background-color, so the footer color
           visually runs continuously to the screen bottom. Stays inside the
           sheet's padding-box, so `overflow: hidden` on the sheet does not
           clip it. Only active on phone-sized viewports. */
        .ka-mobile-fullbleed-footer-extend {
          position: relative;
        }
        .ka-mobile-fullbleed-footer-extend::after {
          content: '';
          position: absolute;
          left: 0;
          right: 0;
          top: 100%;
          height: var(--sab);
          background-color: inherit;
          pointer-events: none;
        }

        .ka-mobile-fullbleed-sheet {
          width: 100vw !important;
          /* Phase 7 regression fix (iOS PWA viewport collapse):
             - `100dvh` was dropped because it triggers the iOS PWA
               cold-start bug (returns stale values until a geometry
               change). `var(--app-height)` is kept in sync with the
               JS-measured innerHeight by `useAppViewport.ts`.
             - `env(safe-area-inset-*)` was dropped because the same
               iOS regression makes env() return 0 on cold start, which
               collapsed our safe-area padding and parked header/X under
               the notch / home indicator. `var(--sat/--sab)` defaults
               to env() for the happy path and is overridden by the
               DOM probe in `useAppViewport.ts` when the probe detects
               0 (viewport-fit=auto<->cover toggle forces recalc). */
          height: var(--app-height) !important;
          max-width: 100vw !important;
          max-height: var(--app-height) !important;
          border-radius: 0 !important;
          border-left: none !important;
          border-right: none !important;
          padding-top: var(--sat) !important;
          padding-bottom: var(--sab) !important;
          box-sizing: border-box !important;
        }
      }

      /* === Chromium autofill overrides ===
         When the browser fills a saved credential (API keys, Tavily, Fish Audio,
         account username/password, etc.), Chromium paints the field with its
         native pale yellow/white background via `:-webkit-autofill`. The only
         way to defeat that is an `inset box-shadow` of 1000px — real bg
         properties are ignored by the UA. We also freeze the built-in color
         transition so autofill doesn't flash as the form hydrates. */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active,
      textarea:-webkit-autofill {
        -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
        -webkit-text-fill-color: #3f2f22 !important;
        caret-color: #3f2f22 !important;
        transition: background-color 99999s ease-in-out 0s;
        border-radius: inherit;
      }
      html.ka-dark input:-webkit-autofill,
      html.ka-dark input:-webkit-autofill:hover,
      html.ka-dark input:-webkit-autofill:focus,
      html.ka-dark input:-webkit-autofill:active,
      html.ka-dark textarea:-webkit-autofill {
        -webkit-box-shadow: 0 0 0 1000px #211811 inset !important;
        -webkit-text-fill-color: #f2e5cf !important;
        caret-color: #f2e5cf !important;
      }

      /* === Dark-mode input bg safety net ===
         The Tailwind Play CDN runtime JIT is unreliable at compiling
         `bg-[#hex]/NN` (hex + slash-opacity) arbitrary classes on
         <input>/<textarea>: in practice the generated stylesheet sometimes
         omits them, leaving the controls rendered with the UA-default white
         fill. The "台词" textarea in SovitsRefPromptEditorModal is the canary:
         it hardcodes a solid `bg-[#0f0d0c]` (no slash opacity) and renders
         correctly, while every <input> that relied on `bg-[#211811]/94` via
         SettingsPanel's shared `inputClass` went white. We've also swapped
         those Tailwind classes to solid `bg-[#211811]` at source; this block
         is a scoped last-line-of-defense so any future slip (new arbitrary
         opacity, Tailwind version quirk, temporary JIT miss) still lands on
         the warm dark fill instead of flashing pure white. */
      html.ka-dark .ka-settings-shell input[type="text"],
      html.ka-dark .ka-settings-shell input[type="number"],
      html.ka-dark .ka-settings-shell input[type="email"],
      html.ka-dark .ka-settings-shell input[type="password"],
      html.ka-dark .ka-settings-shell input[type="search"],
      html.ka-dark .ka-settings-shell input[type="url"],
      html.ka-dark .ka-settings-shell input[type="tel"],
      html.ka-dark .ka-settings-shell input:not([type]),
      html.ka-dark .ka-settings-shell textarea,
      html.ka-dark .config-bg input[type="text"],
      html.ka-dark .config-bg input[type="number"],
      html.ka-dark .config-bg input[type="email"],
      html.ka-dark .config-bg input[type="password"],
      html.ka-dark .config-bg input[type="search"],
      html.ka-dark .config-bg input[type="url"],
      html.ka-dark .config-bg input[type="tel"],
      html.ka-dark .config-bg input:not([type]),
      html.ka-dark .config-bg textarea {
        background-color: #211811 !important;
        color: #f2e5cf !important;
        caret-color: #f2e5cf !important;
      }
      html.ka-dark .ka-settings-shell input::placeholder,
      html.ka-dark .ka-settings-shell textarea::placeholder,
      html.ka-dark .config-bg input::placeholder,
      html.ka-dark .config-bg textarea::placeholder {
        color: #8e7659 !important;
        opacity: 1;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
